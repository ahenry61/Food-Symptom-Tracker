function uid() {
  return Math.random().toString(36).slice(2, 10);
}
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function fmtDateShort(d) {
  return new Date(d + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function fmtDateFull(d) {
  return new Date(d + "T00:00:00").toLocaleDateString(undefined, {
    weekday: "long",
    month: "long",
    day: "numeric",
    year: "numeric",
  });
}
function scaleColor(v) {
  if (v == null) return "var(--ink-faint)";
  if (v <= 3) return "var(--good)";
  if (v <= 6) return "var(--warn)";
  return "var(--accent)";
}
function worstFlag(a, b) {
  const rank = { none: 0, orange: 1, red: 2 };
  return rank[a] >= rank[b] ? a : b;
}

function histamineLibraryItems() {
  return HISTAMINE_LIBRARY_RAW.map((f) => ({ id: uid(), ...f }));
}

function mergeHistamineIntoLibrary(baseList) {
  const upgradeMap = {};
  HISTAMINE_UPGRADES.forEach((u) => { upgradeMap[u.name_lower] = u; });

  const upgraded = baseList.map((f) => {
    const u = upgradeMap[f.name.toLowerCase()];
    if (!u) return f;
    const level = worstFlag(f.flagLevel, u.level);
    if (level === f.flagLevel) return f;
    return { ...f, flagLevel: level, flagReason: f.flagReason || u.reason };
  });

  const existingNames = new Set(upgraded.map((f) => f.name.toLowerCase()));
  const additions = histamineLibraryItems().filter((f) => !existingNames.has(f.name.toLowerCase()));

  return [...upgraded, ...additions];
}

async function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
    return fallback;
  } catch (e) {
    return fallback;
  }
}
async function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    console.error("save failed", key, e);
    return false;
  }
}

function blankEntry(date) {
  return {
    date,
    meals: [],
    sleep: null,
    pain: null,
    stress: null,
    periodOn: false,
    flow: "Light",
    pms: [],
    notes: "",
  };
}

/* Compute flag level for a name against watch list */
function matchWatchList(name, watchList) {
  const lower = name.toLowerCase();
  let level = "none";
  let reasons = [];
  watchList.forEach((w) => {
    if (lower.includes(w.term.toLowerCase())) {
      level = worstFlag(level, w.level);
      reasons.push(w.reason);
    }
  });
  return { level, reason: reasons.join("; ") };
}

function MealBuilder({ library, watchList, onSave, onCancel, recentFoods }) {
  const [mealType, setMealType] = useState("Breakfast");
  const [time, setTime] = useState("");
  const [query, setQuery] = useState("");
  const [items, setItems] = useState([]); // {libId, name, sizeId, sizeLabel, amount, calories, protein, flagLevel, flagReason}
  const [symptoms, setSymptoms] = useState([]);
  const [notes, setNotes] = useState("");
  const [saveComboName, setSaveComboName] = useState("");
  const [showSaveCombo, setShowSaveCombo] = useState(false);

  const matches = query.trim()
    ? library.filter((f) => f.name.toLowerCase().includes(query.trim().toLowerCase())).slice(0, 6)
    : [];

  const addFoodItem = (food) => {
    const defaultSize = food.sizes[Math.min(1, food.sizes.length - 1)];
    setItems((prev) => [
      ...prev,
      {
        rowId: uid(),
        libId: food.id,
        name: food.name,
        sizeId: defaultSize.id,
        sizeLabel: defaultSize.label,
        amount: defaultSize.amount,
        calories: defaultSize.calories,
        protein: defaultSize.protein,
        flagLevel: food.flagLevel,
        flagReason: food.flagReason,
        sizes: food.sizes,
      },
    ]);
    setQuery("");
  };

  const changeSize = (rowId, size) => {
    setItems((prev) =>
      prev.map((it) =>
        it.rowId === rowId
          ? { ...it, sizeId: size.id, sizeLabel: size.label, amount: size.amount, calories: size.calories, protein: size.protein }
          : it
      )
    );
  };

  const removeItem = (rowId) => setItems((prev) => prev.filter((it) => it.rowId !== rowId));

  const toggleSymptom = (s) =>
    setSymptoms((prev) => (prev.includes(s) ? prev.filter((x) => x !== s) : [...prev, s]));

  const mealFlag = items.reduce((acc, it) => worstFlag(acc, it.flagLevel), "none");
  const totalCal = items.reduce((sum, it) => sum + (it.calories || 0), 0);
  const totalProtein = items.reduce((sum, it) => sum + (it.protein || 0), 0);

  const flaggedNames = items.filter((it) => it.flagLevel !== "none").map((it) => it.name);

  const handleSave = () => {
    if (items.length === 0) return;
    onSave({
      id: uid(),
      type: mealType,
      time,
      items,
      symptoms,
      notes,
      flagLevel: mealFlag,
      totalCal,
      totalProtein,
      saveAsCombo: showSaveCombo && saveComboName.trim() ? saveComboName.trim() : null,
    });
  };

  return (
    <div className="meal-builder">
      <div className="meal-builder-head">
        <div className="segmented">
          {MEAL_TYPES.map((t) => (
            <Pill key={t} active={mealType === t} onClick={() => setMealType(t)}>{t}</Pill>
          ))}
        </div>
        <input type="time" className="text-input time-input" value={time} onChange={(e) => setTime(e.target.value)} />
      </div>

      {recentFoods && recentFoods.length > 0 && (
        <div className="quick-add-row">
          <span className="quick-add-label">Quick add</span>
          <div className="quick-add-chips">
            {recentFoods.map((f) => (
              <button type="button" key={f.id} className="quick-add-chip" onClick={() => addFoodItem(f)}>
                {f.name}
                {f.flagLevel !== "none" && (
                  <span className={`chip-dot dot-${f.flagLevel}`} />
                )}
              </button>
            ))}
          </div>
        </div>
      )}

      <div className="food-search">
        <input
          className="text-input search-input"
          placeholder="Search food library (e.g. chicken, rice, egg)..."
          value={query}
          onChange={(e) => setQuery(e.target.value)}
        />
        {matches.length > 0 && (
          <div className="search-results">
            {matches.map((f) => (
              <button type="button" key={f.id} className="search-result-row" onClick={() => addFoodItem(f)}>
                <span>{f.name}</span>
                <FlagBadge level={f.flagLevel} reason={f.flagReason} />
                {f.isCombo && <span className="tag tag-combo">quick meal</span>}
              </button>
            ))}
          </div>
        )}
      </div>

      {mealFlag !== "none" && (
        <div className={`meal-flag-banner banner-${mealFlag}`}>
          <strong>{mealFlag === "red" ? "⚠ Watch out —" : "◐ Heads up —"}</strong>{" "}
          this meal contains {flaggedNames.join(", ")}.
        </div>
      )}

      <div className="meal-items">
        {items.length === 0 && <p className="empty-note">Search above and tap a food to add it to this meal.</p>}
        {items.map((it) => (
          <div className="meal-item-row" key={it.rowId}>
            <div className="meal-item-top">
              <span className="food-name">{it.name}</span>
              <FlagBadge level={it.flagLevel} reason={it.flagReason} />
              <button type="button" className="remove-btn inline" onClick={() => removeItem(it.rowId)}>×</button>
            </div>
            <div className="size-row">
              <div className="segmented size-segmented">
                {it.sizes.map((s) => (
                  <Pill key={s.id} active={it.sizeId === s.id} onClick={() => changeSize(it.rowId, s)}>
                    {s.label}
                  </Pill>
                ))}
              </div>
              <span className="macro-note">{it.amount} · {it.calories} cal · {it.protein}g protein</span>
            </div>
          </div>
        ))}
      </div>

      {items.length > 0 && (
        <div className="meal-totals">
          <span>Total: <strong>{totalCal} cal</strong> · <strong>{totalProtein}g protein</strong></span>
          {items.length > 1 && (
            <button type="button" className="link-btn" onClick={() => setShowSaveCombo((s) => !s)}>
              {showSaveCombo ? "Cancel save" : "Save this as a quick meal"}
            </button>
          )}
        </div>
      )}
      {showSaveCombo && (
        <input
          className="text-input"
          placeholder="Name this combo (e.g. 'My pasta bowl')"
          value={saveComboName}
          onChange={(e) => setSaveComboName(e.target.value)}
        />
      )}

      <div className="symptom-section">
        <span className="field-label">How did she feel after? (optional, can add later)</span>
        <div className="symptom-grid">
          {SYMPTOMS.map((s) => (
            <Pill key={s} active={symptoms.includes(s)} onClick={() => toggleSymptom(s)} tone="var(--accent)">
              {s}
            </Pill>
          ))}
        </div>
      </div>

      <input
        className="text-input"
        placeholder="Notes about this meal (optional)"
        value={notes}
        onChange={(e) => setNotes(e.target.value)}
      />

      <div className="meal-builder-actions">
        <button type="button" className="btn-secondary" onClick={onCancel}>Cancel</button>
        <button type="button" className="btn-primary" onClick={handleSave} disabled={items.length === 0}>
          Save meal
        </button>
      </div>
    </div>
  );
}

function computeRecentFoods(entries, library, max = 6) {
  const seen = new Set();
  const result = [];
  const dates = Object.keys(entries).sort((a, b) => (a < b ? 1 : -1));
  for (const d of dates) {
    const meals = (entries[d].meals || []).slice().reverse();
    for (const m of meals) {
      for (const it of m.items.slice().reverse()) {
        if (seen.has(it.libId)) continue;
        const food = library.find((f) => f.id === it.libId);
        if (!food) continue;
        seen.add(it.libId);
        result.push(food);
        if (result.length >= max) return result;
      }
    }
  }
  return result;
}

function LogTab({ entries, setEntries, persist, selectedDate, setSelectedDate, library, watchList }) {
  const entry = entries[selectedDate] || blankEntry(selectedDate);
  const [builderOpen, setBuilderOpen] = useState(false);
  const [editingSymptomsFor, setEditingSymptomsFor] = useState(null);
  const recentFoods = useMemo(() => computeRecentFoods(entries, library), [entries, library]);

  const updateEntry = useCallback(
    (patch) => {
      const updated = { ...(entries[selectedDate] || blankEntry(selectedDate)), ...patch };
      const next = { ...entries, [selectedDate]: updated };
      setEntries(next);
      persist(next);
    },
    [entries, selectedDate, entries, setEntries, persist]
  );

  const saveMeal = (meal) => {
    updateEntry({ meals: [...entry.meals, meal] });
    setBuilderOpen(false);
  };

  const removeMeal = (id) => {
    updateEntry({ meals: entry.meals.filter((m) => m.id !== id) });
  };

  const toggleMealSymptom = (mealId, symptom) => {
    updateEntry({
      meals: entry.meals.map((m) => {
        if (m.id !== mealId) return m;
        const has = m.symptoms.includes(symptom);
        return { ...m, symptoms: has ? m.symptoms.filter((s) => s !== symptom) : [...m.symptoms, symptom] };
      }),
    });
  };

  const togglePms = (opt) => {
    const has = entry.pms.includes(opt);
    updateEntry({ pms: has ? entry.pms.filter((p) => p !== opt) : [...entry.pms, opt] });
  };

  const dayCal = entry.meals.reduce((s, m) => s + m.totalCal, 0);
  const dayProtein = entry.meals.reduce((s, m) => s + m.totalProtein, 0);

  return (
    <div className="tab-body">
      <div className="date-row">
        <label className="field-label" htmlFor="date-picker">Entry date</label>

          <div>
            <h3 className="card-title">Meals</h3>
            {entry.meals.length > 0 && (
              <p className="card-sub">{dayCal} cal · {dayProtein}g protein today</p>
            )}
          </div>
          {!builderOpen && (
            <button type="button" className="btn-primary" onClick={() => setBuilderOpen(true)}>+ Add meal</button>
          )}
        </div>

        {builderOpen && (
          <MealBuilder
            library={library}
            watchList={watchList}
            onSave={(meal) => {
              // handle combo save at parent level so it can touch library too via callback prop
              saveMeal(meal);
            }}
            onCancel={() => setBuilderOpen(false)}
            recentFoods={recentFoods}

        )}

        <div className="meal-list">
          {entry.meals.length === 0 && !builderOpen && (
            <p className="empty-note">No meals logged yet today.</p>

            <div className="meal-card" key={m.id}>
              <div className="meal-card-head">
                <span className="meal-type">{m.type}{m.time ? ` · ${m.time}` : ""}</span>
                <FlagBadge level={m.flagLevel} reason="" />
                <button type="button" className="remove-btn inline" onClick={() => removeMeal(m.id)}>×</button>
              </div>
              <div className="meal-card-items">

                  <span className="meal-item-chip" key={i}>

                  </span>
                ))}
              </div>
              <div className="meal-card-foot">
                <span className="macro-note">{m.totalCal} cal · {m.totalProtein}g protein</span>
                <button type="button" className="link-btn" onClick={() => setEditingSymptomsFor(editingSymptomsFor === m.id ? null : m.id)}>
                  {m.symptoms.length > 0 ? `${m.symptoms.length} symptom${m.symptoms.length > 1 ? "s" : ""}` : "Add symptoms"}
                </button>

              ))}
            </div>
          )}
        </div>
        <div className="pms-grid">
          {PMS_OPTIONS.map((opt) => (
            <label className="checkbox-row small" key={opt}>
              <input type="checkbox" checked={entry.pms.includes(opt)} onChange={() => togglePms(opt)} />
              {opt}

          ))}
        </div>
        <textarea className="textarea" placeholder="Anything else for the day..." rows={2} value={entry.notes} onChange={(e) => updateEntry({ notes: e.target.value })} />
      </details>
    </div>
  );
}

function LibraryTab({ library, setLibrary, persistLibrary, watchList }) {
  const [query, setQuery] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(emptyFoodForm());

  function emptyFoodForm() {
    return {
      name: "",
      category: "Other",
      flagLevel: "none",
      flagReason: "",
      sizes: [
        { id: "Small", label: "Small", amount: "", calories: "", protein: "" },
        { id: "Medium", label: "Medium", amount: "", calories: "", protein: "" },
        { id: "Large", label: "Large", amount: "", calories: "", protein: "" },
      ],
    };
  }

  const filtered = query.trim()
    ? library.filter((f) => f.name.toLowerCase().includes(query.trim().toLowerCase()))
    : library;

  const grouped = filtered.reduce((acc, f) => {
    acc[f.category] = acc[f.category] || [];
    acc[f.category].push(f);
    return acc;
  }, {});

  const suggestFlag = (name) => {
    const m = matchWatchList(name, watchList);
    return m;
  };

  const onNameChange = (name) => {
    const suggestion = suggestFlag(name);
    setForm((f) => ({
      ...f,
      name,
      flagLevel: suggestion.level !== "none" ? suggestion.level : f.flagLevel,
      flagReason: suggestion.level !== "none" ? suggestion.reason : f.flagReason,
    }));
  };

  const updateSize = (id, field, value) => {
    setForm((f) => ({
      ...f,
      sizes: f.sizes.map((s) => (s.id === id ? { ...s, [field]: value } : s)),
    }));
  };

  const saveFood = () => {
    if (!form.name.trim()) return;
    const newFood = {
      id: uid(),
      name: form.name.trim(),
      category: form.category,
      isCombo: false,
      flagLevel: form.flagLevel,
      flagReason: form.flagReason,
      sizes: form.sizes.map((s) => ({
        id: s.id,
        label: s.label,
        amount: s.amount || "1 serving",
        calories: Number(s.calories) || 0,
        protein: Number(s.protein) || 0,
      })),
    };
    const next = [...library, newFood];
    setLibrary(next);
    persistLibrary(next);
    setForm(emptyFoodForm());
    setShowForm(false);
  };

  const deleteFood = (id) => {
    const next = library.filter((f) => f.id !== id);
    setLibrary(next);
    persistLibrary(next);
  };

  return (
    <div className="tab-body">
      <div className="card">
        <div className="meals-head">
          <div>
            <h3 className="card-title">Food library</h3>
            <p className="card-sub">Everything she can quickly add to a meal, with pre-set sizes and macros.</p>
          </div>
          {!showForm && <button type="button" className="btn-primary" onClick={() => setShowForm(true)}>+ Add food</button>}
        </div>

        {showForm && (
          <div className="food-form-panel">
            <input className="text-input" placeholder="Food name" value={form.name} onChange={(e) => onNameChange(e.target.value)} />
            <select className="text-input" value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>
              {["Protein", "Carb", "Vegetable", "Fruit", "Dairy", "Fat", "Other"].map((c) => <option key={c}>{c}</option>)}
            </select>

            <div className="flag-select-row">
              <span className="field-label">Flag:</span>
              <Pill active={form.flagLevel === "none"} onClick={() => setForm({ ...form, flagLevel: "none" })}>None</Pill>
              <Pill active={form.flagLevel === "orange"} onClick={() => setForm({ ...form, flagLevel: "orange" })} tone="var(--warn)">High histamine</Pill>
              <Pill active={form.flagLevel === "red"} onClick={() => setForm({ ...form, flagLevel: "red" })} tone="var(--accent)">Bloodwork flag</Pill>
            </div>
            {form.flagLevel !== "none" && (
              <input className="text-input" placeholder="Reason (optional)" value={form.flagReason} onChange={(e) => setForm({ ...form, flagReason: e.target.value })} />
            )}

            <div className="size-form-grid">
              {form.sizes.map((s) => (
                <div className="size-form-row" key={s.id}>
                  <span className="size-form-label">{s.label}</span>
                  <input className="text-input" placeholder="Amount (e.g. 6 oz)" value={s.amount} onChange={(e) => updateSize(s.id, "amount", e.target.value)} />
                  <input className="text-input narrow" type="number" placeholder="Cal" value={s.calories} onChange={(e) => updateSize(s.id, "calories", e.target.value)} />
                  <input className="text-input narrow" type="number" placeholder="Protein g" value={s.protein} onChange={(e) => updateSize(s.id, "protein", e.target.value)} />

              <button type="button" className="btn-secondary" onClick={() => { setShowForm(false); setForm(emptyFoodForm()); }}>Cancel</button>
              <button type="button" className="btn-primary" onClick={saveFood}>Save food</button>
            </div>
          </div>
        )}

        <input className="text-input" style={{ marginTop: 14 }} placeholder="Search library..." value={query} onChange={(e) => setQuery(e.target.value)} />

        <div className="library-groups">
          {Object.keys(grouped).sort().map((cat) => (
            <div key={cat} className="library-group">
              <span className="library-group-title">{cat}</span>
              <div className="library-items">
                {grouped[cat].map((f) => (

                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );

/* ---------------------------------------------------------
   TREND CHART — dependency-free SVG line chart (Sleep/Pain/Stress)
--------------------------------------------------------- */
function TrendChart({ data }) {
  const width = 720;
  const height = 240;
  const padL = 32;
  const padR = 12;
  const padT = 12;
  const padB = 28;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;
  const n = data.length;

  const x = (i) => padL + (n <= 1 ? 0 : (i / (n - 1)) * plotW);
  const y = (v) => padT + plotH - (v / 10) * plotH;

  const seriesDefs = [
    { key: "Sleep", color: "var(--primary)" },
    { key: "Pain", color: "var(--accent)" },
    { key: "Stress", color: "var(--warn)" },
  ];

  const buildPath = (key) => {
    let d = "";
    let started = false;
    data.forEach((pt, i) => {
      const v = pt[key];
      if (v == null) {
        started = false;
        return;
      }
      const cmd = started ? "L" : "M";
      d += `${cmd}${x(i).toFixed(1)},${y(v).toFixed(1)} `;
      started = true;
    });
    return d.trim();
  };

  const gridLines = [0, 2.5, 5, 7.5, 10];
  const tickEvery = Math.max(1, Math.ceil(n / 7));

  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="trend-svg" role="img" aria-label="Sleep, pain and stress trend over time">
      {gridLines.map((g) => (
        <line key={g} x1={padL} x2={width - padR} y1={y(g)} y2={y(g)} stroke="var(--line)" strokeWidth="1" />
      ))}
      <line x1={padL} x2={width - padR} y1={y(5)} y2={y(5)} stroke="var(--line-strong)" strokeDasharray="3 3" strokeWidth="1" />
      {gridLines.map((g) => (
        <text key={g} x={padL - 6} y={y(g) + 3} textAnchor="end" className="chart-axis-label">{g}</text>
      ))}
      {data.map((pt, i) =>
        i % tickEvery === 0 ? (
          <text key={i} x={x(i)} y={height - 8} textAnchor="middle" className="chart-axis-label">{pt.date}</text>
        ) : null
      )}
      {seriesDefs.map((s) => (
        <path key={s.key} d={buildPath(s.key)} fill="none" stroke={s.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      ))}
      {seriesDefs.map((s) =>
        data.map((pt, i) => {
          const v = pt[s.key];
          if (v == null) return null;
          return <circle key={`${s.key}-${i}`} cx={x(i)} cy={y(v)} r="2.6" fill={s.color}><title>{`${s.key}: ${v}`}</title></circle>;
        })
      )}
    </svg>
  );
}

function ReportTab({ entries }) {
  const sortedDates = Object.keys(entries).sort();
  const last14 = useMemo(() => {
    const base = sortedDates.length ? sortedDates[sortedDates.length - 1] : todayStr();
    const end = new Date(base + "T00:00:00");
    const arr = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date(end);
      d.setDate(end.getDate() - i);
      arr.push(d.toISOString().slice(0, 10));
    }
    return arr;
  }, [sortedDates]);

  const chartData = last14.map((d) => {
    const e = entries[d];
    return { date: fmtDateShort(d), Sleep: e ? e.sleep : null, Pain: e ? e.pain : null, Stress: e ? e.stress : null };
  });

  const ingredientTally = useMemo(() => {
    const map = {};
    Object.values(entries).forEach((e) => {
      e.meals.forEach((m) => {
        const hadSymptom = m.symptoms.length > 0;
        m.items.forEach((it) => {
          if (it.flagLevel === "none") return;
          const key = it.name;
          if (!map[key]) map[key] = { name: key, level: it.flagLevel, timesEaten: 0, timesSymptom: 0, symptoms: {} };
          map[key].timesEaten += 1;
          if (hadSymptom) {
            map[key].timesSymptom += 1;
            m.symptoms.forEach((s) => { map[key].symptoms[s] = (map[key].symptoms[s] || 0) + 1; });
          }
        });
      });
    });
    return Object.values(map).sort((a, b) => b.timesSymptom - a.timesSymptom || b.timesEaten - a.timesEaten);
  }, [entries]);

  const daysLogged = Object.keys(entries).length;

  return (
    <div className="tab-body report-body">
      <div className="report-header no-print">
        <div>
          <h3 className="card-title">Report for the doctor</h3>
          <p className="card-sub">{daysLogged} days logged. Use Print to save as PDF.</p>
        </div>
        <button className="btn-primary" onClick={() => window.print()}>Print / Save as PDF</button>
      </div>

      <div className="print-only print-title">
        <h1>Food &amp; Symptom Tracking Report</h1>
        <p>{daysLogged} days logged · generated {fmtDateFull(todayStr())}</p>
      </div>

      <div className="card chart-card">
        <h3 className="card-title">Sleep / Pain / Stress trend</h3>
        <TrendChart data={chartData} />
        <div className="chart-legend">
          <span><i style={{ background: "var(--primary)" }} /> Sleep quality (poor = high)</span>
          <span><i style={{ background: "var(--accent)" }} /> Pain</span>
          <span><i style={{ background: "var(--warn)" }} /> Stress</span>
        </div>
      </div>

      <div className="card">
        <h3 className="card-title">Flagged ingredients vs. symptoms</h3>
        {ingredientTally.length === 0 && <p className="empty-note">No flagged foods logged yet.</p>}
        {ingredientTally.length > 0 && (
          <table className="report-table">
            <thead><tr><th>Ingredient</th><th>Flag</th><th>Times eaten</th><th>Meals with symptoms</th><th>Most common symptom</th></tr></thead>
            <tbody>
              {ingredientTally.map((r) => {
                const topSymptom = Object.entries(r.symptoms).sort((a, b) => b[1] - a[1])[0];
                return (
                  <tr key={r.name}>
                    <td>{r.name}</td>
                    <td><FlagBadge level={r.level} reason="" /></td>
                    <td className="mono">{r.timesEaten}</td>
                    <td className="mono">{r.timesSymptom}</td>
                    <td>{topSymptom ? topSymptom[0] : "—"}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      <div className="card">
        <h3 className="card-title">Daily meal log</h3>
        {sortedDates.map((date) => {
          const e = entries[date];
          if (e.meals.length === 0) return null;
          return (
            <div key={date} className="report-day-block">
              <div className="report-day-head">
                <span className="report-day-date">{fmtDateFull(date)}</span>
                {e.periodOn && <span className="tag tag-period">period</span>}
                <span className="card-sub" style={{ margin: 0 }}>
                  Sleep {e.sleep ?? "—"} · Pain {e.pain ?? "—"} · Stress {e.stress ?? "—"}
                </span>
              </div>
              {e.meals.map((m) => (
                <div className="report-meal-row" key={m.id}>
                  <span className="report-meal-type">{m.type}{m.time ? ` (${m.time})` : ""}</span>
                  <span>
                    {m.items.map((it) => `${it.name} – ${it.sizeLabel}`).join(", ")}
                  </span>
                  {m.symptoms.length > 0 && (
                    <span className="report-meal-symptoms">→ {m.symptoms.join(", ")}</span>
                  )}
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   APP SHELL
--------------------------------------------------------- */
function App() {
  const [entries, setEntries] = useState({});
  const [library, setLibrary] = useState([]);
  const [watchList, setWatchList] = useState([]);
  const [loading, setLoading] = useState(true);
  const [activeTab, setActiveTab] = useState("log");
  const [selectedDate, setSelectedDate] = useState(todayStr());
  const [saveState, setSaveState] = useState("idle");

  useEffect(() => {
    (async () => {
      const [e, lib, wl] = await Promise.all([
        loadJSON(ENTRIES_KEY, {}),
        loadJSON(LIBRARY_KEY, null),
        loadJSON(WATCHLIST_KEY, null),
      ]);
      let finalLib = lib;
      let finalWl = wl;
      if (!finalWl) {
        finalWl = starterWatchList();
        await saveJSON(WATCHLIST_KEY, finalWl);
      }
      if (!finalLib) {
        finalLib = starterLibrary();
        // apply watch-list based flags on top of curated starter flags where stronger
        finalLib = finalLib.map((f) => {
          const m = matchWatchList(f.name, finalWl);
          if (worstFlag(f.flagLevel, m.level) !== f.flagLevel) {
            return { ...f, flagLevel: worstFlag(f.flagLevel, m.level), flagReason: f.flagReason || m.reason };
          }
          return f;
        });
        // merge in the full histamine reference list (adds ~430 foods, upgrades a
        // handful of existing curated ones to reflect their histamine tier)
        finalLib = mergeHistamineIntoLibrary(finalLib);
        await saveJSON(LIBRARY_KEY, finalLib);
      }
      setEntries(e);
      setLibrary(finalLib);
      setWatchList(finalWl);
      setLoading(false);
    })();
  }, []);

  const persistEntries = useCallback(async (next) => {
    setSaveState("saving");
    const ok = await saveJSON(ENTRIES_KEY, next);
    setSaveState(ok ? "saved" : "error");
    if (ok) setTimeout(() => setSaveState((s) => (s === "saved" ? "idle" : s)), 1200);
  }, []);
  const persistLibrary = useCallback(async (next) => { await saveJSON(LIBRARY_KEY, next); }, []);
  const persistWatchList = useCallback(async (next) => { await saveJSON(WATCHLIST_KEY, next); }, []);

  // wrap saveMeal to also persist combo into library when requested
  const setEntriesWithComboHandling = useCallback(
    async (nextEntries, comboMeta) => {
      setEntries(nextEntries);
      await persistEntries(nextEntries);
      if (comboMeta) {
        const { name, items, totalCal, totalProtein } = comboMeta;
        const flagLevel = items.reduce((acc, it) => worstFlag(acc, it.flagLevel), "none");
        const flagReason = items.filter((it) => it.flagLevel !== "none").map((it) => it.flagReason).filter(Boolean).join("; ");
        const comboFood = {
          id: uid(),
          name,
          category: "Combo",
          isCombo: true,
          flagLevel,
          flagReason,
          sizes: [{ id: "combo", label: "1 serving", amount: "as made", calories: totalCal, protein: totalProtein }],
        };
        const nextLib = [...library, comboFood];
        setLibrary(nextLib);
        await persistLibrary(nextLib);
      }
    },
    [library, persistEntries, persistLibrary]
  );

  // Custom setEntries passed to LogTab needs to detect combo save flag on meal object
  const handleSetEntriesFromLog = useCallback(
    (next) => {
      // find if any meal in `next` for selectedDate has saveAsCombo set and hasn't been processed
      const dayEntry = next[selectedDate];
      if (dayEntry) {
        const lastMeal = dayEntry.meals[dayEntry.meals.length - 1];
        if (lastMeal && lastMeal.saveAsCombo) {
          const comboMeta = {
            name: lastMeal.saveAsCombo,
            items: lastMeal.items,
            totalCal: lastMeal.totalCal,
            totalProtein: lastMeal.totalProtein,
          };
          const cleaned = { ...lastMeal };
          delete cleaned.saveAsCombo;
          const cleanedMeals = [...dayEntry.meals.slice(0, -1), cleaned];
          const cleanedNext = { ...next, [selectedDate]: { ...dayEntry, meals: cleanedMeals } };
          setEntriesWithComboHandling(cleanedNext, comboMeta);
          return;
        }
      }
      setEntriesWithComboHandling(next, null);
    },
    [selectedDate, setEntriesWithComboHandling]
  );

  if (loading) {
    return <div className="loading-screen"><style>{FONT_IMPORTS}{TOKENS}</style>Loading tracker…</div>;
  }

  return (
    <div className="app-root">
      <style>{`
        ${FONT_IMPORTS}
        ${TOKENS}
        * { box-sizing: border-box; }
        .app-root { font-family: var(--font-body); background: var(--bg); color: var(--ink); min-height: 100%; }
        .loading-screen { font-family: var(--font-body); padding: 40px; color: var(--ink-soft); }
        .shell { max-width: 880px; margin: 0 auto; padding: 28px 20px 60px; }

        .header-band {
          position: relative;
          background: var(--primary);
          background-image: radial-gradient(rgba(255,255,255,0.07) 1.4px, transparent 1.4px);
          background-size: 15px 15px;
          padding: 34px 20px 30px;
          overflow: hidden;
        }
        .header-band::after {
          content: "";
          position: absolute;
          right: -60px; top: -60px;
          width: 220px; height: 220px;
          border-radius: 50%;
          background: rgba(255,255,255,0.05);
        }
        .header-inner { max-width: 880px; margin: 0 auto; display: flex; align-items: flex-start; gap: 16px; position: relative; }
        .header-icon { width: 40px; height: 40px; flex-shrink: 0; color: var(--good-soft); margin-top: 4px; }
        .header-band .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--good-soft); margin: 0 0 6px; }
        .header-band .title { font-family: var(--font-display); font-size: 30px; font-weight: 500; margin: 0 0 6px; color: #FBFAF7; }
        .header-band .subtitle { font-size: 14px; color: rgba(251,250,247,0.82); margin: 0; max-width: 60ch; line-height: 1.5; }
        .save-indicator { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); position: fixed; top: 14px; right: 18px; background: var(--paper); border: 1px solid var(--line); padding: 4px 10px; border-radius: 20px; z-index: 5; }
        .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line-strong); margin: 24px 0 24px; flex-wrap: wrap; }
        .tab-btn { font-family: var(--font-body); font-size: 13.5px; font-weight: 600; color: var(--ink-soft); background: none; border: none; padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-btn:hover:not(.active) { color: var(--ink); }
        .tab-body { display: flex; flex-direction: column; gap: 18px; }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
        .card-title { font-family: var(--font-display); font-size: 18px; font-weight: 500; margin: 0 0 4px; }
        .card-sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 14px; }
        .wellness-card summary { cursor: pointer; list-style: none; }
        .wellness-card summary::-webkit-details-marker { display: none; }
        .wellness-summary::after { content: ' ▾'; font-size: 13px; color: var(--ink-faint); }
        .wellness-card[open] .wellness-summary::after { content: ' ▴'; }
        .wellness-card .scale-grid { margin-top: 14px; }

        .date-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
        .field-label { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
        .date-input { font-family: var(--font-mono); font-size: 14px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink); }
        .date-display { font-family: var(--font-display); font-size: 16px; color: var(--ink-soft); }

        .meals-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }

        .scale-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 16px; }
        .scale-block { display: flex; flex-direction: column; gap: 6px; }
        .scale-head { display: flex; justify-content: space-between; align-items: baseline; }
        .scale-label { font-size: 13px; font-weight: 600; }
        .scale-value { font-family: var(--font-mono); font-size: 20px; font-weight: 600; }
        .range-input { width: 100%; }
        .scale-foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-faint); }

        .period-row { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
        .checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
        .checkbox-row.small { font-size: 12.5px; }
        .checkbox-row input { accent-color: var(--primary); width: 15px; height: 15px; }
        .flow-pills { display: flex; gap: 6px; flex-wrap: wrap; }
        .pms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 14px; margin-bottom: 14px; }

        .pill { font-family: var(--font-body); font-size: 12.5px; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-soft); cursor: pointer; }
        .pill-active { background: var(--primary); border-color: var(--primary); color: white; }
        .size-amount { opacity: 0.8; font-size: 11px; }

        .text-input, .textarea, select.text-input { font-family: var(--font-body); font-size: 13.5px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink); width: 100%; }
        .text-input.narrow { width: 100%; }
        .time-input { max-width: 130px; }
        .textarea { resize: vertical; margin-top: 10px; }

        .btn-primary { font-family: var(--font-body); font-weight: 600; font-size: 13.5px; background: var(--primary); color: white; border: none; padding: 9px 18px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
        .btn-primary:hover { background: #244842; }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-secondary { font-family: var(--font-body); font-weight: 600; font-size: 13.5px; background: var(--surface); color: var(--ink-soft); border: 1px solid var(--line-strong); padding: 9px 18px; border-radius: 6px; cursor: pointer; }

        .empty-note { font-size: 13px; color: var(--ink-faint); font-style: italic; margin: 0; }

        /* Meal builder */
        .meal-builder { display: flex; flex-direction: column; gap: 12px; border: 1px dashed var(--line-strong); border-radius: 8px; padding: 16px; margin-bottom: 16px; background: var(--paper); }
        .meal-builder-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .segmented { display: inline-flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; flex-wrap: wrap; }
        .segmented .pill { border: none; background: transparent; color: var(--ink-soft); border-radius: 7px; padding: 6px 14px; }
        .segmented .pill-active { background: var(--surface); color: var(--primary); box-shadow: 0 1px 3px rgba(27,43,41,0.15); }

        .quick-add-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .quick-add-label { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); flex-shrink: 0; }
        .quick-add-chips { display: flex; gap: 6px; flex-wrap: wrap; }
        .quick-add-chip {
          display: inline-flex; align-items: center; gap: 6px;
          font-family: var(--font-body); font-size: 12.5px; font-weight: 500;
          background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink);
          border-radius: 16px; padding: 6px 12px; cursor: pointer;
        }
        .quick-add-chip:hover { border-color: var(--primary); color: var(--primary); }
        .chip-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
        .dot-red { background: var(--accent); }
        .dot-orange { background: var(--warn); }
        .search-input { font-size: 14px; padding: 10px 12px; }
        .food-search { position: relative; }
        .search-results { border: 1px solid var(--line-strong); border-radius: 8px; margin-top: 4px; background: var(--surface); overflow: hidden; }
        .search-result-row { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: none; padding: 9px 12px; cursor: pointer; font-size: 13.5px; border-bottom: 1px solid var(--line); }
        .search-result-row:last-child { border-bottom: none; }
        .search-result-row:hover { background: var(--good-soft); }

        .meal-flag-banner { border-radius: 8px; padding: 10px 14px; font-size: 13px; }
        .banner-red { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
        .banner-orange { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }

        .meal-items { display: flex; flex-direction: column; gap: 8px; }
        .meal-item-row { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--surface); }
        .meal-item-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .size-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .size-segmented { padding: 2px; }
        .size-segmented .pill { padding: 5px 11px; font-size: 12px; }
        .macro-note { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-soft); margin-left: auto; }

        .meal-totals { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; }

        .symptom-section { display: flex; flex-direction: column; gap: 8px; }
        .symptom-grid { display: flex; gap: 6px; flex-wrap: wrap; }

        .meal-builder-actions { display: flex; justify-content: flex-end; gap: 8px; }

        .food-name { font-weight: 600; font-size: 13.5px; }
        .flag-badge { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.02em; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }

        .meal-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
        .meal-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--paper); }
        .meal-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .meal-type { font-weight: 600; font-size: 13.5px; }
        .meal-card-items { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
        .meal-item-chip { font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 3px 10px; }
        .chip-size { color: var(--ink-faint); font-size: 11px; }
        .meal-card-foot { display: flex; justify-content: space-between; align-items: center; }
        .meal-notes { font-size: 12.5px; color: var(--ink-soft); margin: 6px 0 0; }
        .symptom-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
        .inline-symptoms { margin-top: 8px; }

        .tag { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; padding: 2px 8px; border-radius: 10px; }
        .tag-period { background: var(--accent-soft); color: var(--accent); }
        .tag-symptom { background: var(--warn-soft); color: var(--warn); }
        .tag-combo { background: var(--primary-soft); color: var(--primary); }

        .remove-btn { background: none; border: none; font-size: 18px; line-height: 1; color: var(--ink-faint); cursor: pointer; padding: 2px 6px; }
        .remove-btn:hover { color: var(--accent); }
        .remove-btn.inline { margin-left: auto; }

        /* Library tab */
        .food-form-panel { display: flex; flex-direction: column; gap: 10px; border: 1px dashed var(--line-strong); border-radius: 8px; padding: 16px; background: var(--paper); margin-bottom: 8px; }
        .flag-select-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .size-form-grid { display: flex; flex-direction: column; gap: 8px; }
        .size-form-row { display: grid; grid-template-columns: 70px 1fr 70px 90px; gap: 8px; align-items: center; }
        .size-form-label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
        .library-groups { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
        .library-group-title { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary); display: block; margin-bottom: 8px; }
        .library-items { display: flex; flex-direction: column; gap: 6px; }
        .library-item { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; flex-wrap: wrap; }
        .library-item-main { display: flex; align-items: center; gap: 8px; min-width: 160px; }
        .library-item-sizes { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); flex: 1; }

        /* Watch list */
        .watchlist-form { display: flex; flex-direction: column; gap: 8px; border: 1px dashed var(--line-strong); border-radius: 8px; padding: 14px; background: var(--paper); margin-bottom: 16px; }
        .watchlist-section { margin-top: 14px; }
        .watchlist-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }

        /* History */
        .history-list { display: flex; flex-direction: column; gap: 8px; }
        .history-row { display: grid; grid-template-columns: 60px 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
        .history-date-col { display: flex; flex-direction: column; }
        .history-date { font-family: var(--font-mono); font-weight: 600; font-size: 13px; }
        .history-weekday { font-size: 11px; color: var(--ink-faint); }
        .history-stats { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 12.5px; }
        .stat { font-family: var(--font-mono); font-weight: 600; color: var(--ink-soft); }
        .history-actions { display: flex; gap: 10px; }
        .link-btn { background: none; border: none; color: var(--primary); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 0; }
        .link-btn.danger { color: var(--accent); }

        /* Report */
        .report-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
        .print-only { display: none; }
        .chart-card {}
        .trend-svg { width: 100%; height: 240px; }
        .chart-axis-label { font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-soft); }
        .chart-legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-soft); margin-top: 10px; }
        .chart-legend span { display: inline-flex; align-items: center; gap: 5px; }
        .chart-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
        .report-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
        .report-table th { text-align: left; font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-soft); border-bottom: 1px solid var(--line-strong); padding: 6px 8px; }
        .report-table td { border-bottom: 1px solid var(--line); padding: 7px 8px; vertical-align: top; }
        .report-table td.mono { font-family: var(--font-mono); font-weight: 600; }
        .report-day-block { padding: 10px 0; border-bottom: 1px solid var(--line); }
        .report-day-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
        .report-day-date { font-family: var(--font-display); font-size: 15px; }
        .report-meal-row { font-size: 12.5px; padding: 4px 0 4px 10px; border-left: 2px solid var(--line-strong); margin-left: 4px; }
        .report-meal-type { font-weight: 600; margin-right: 8px; }
        .report-meal-symptoms { color: var(--accent); margin-left: 8px; }

        @media (max-width: 600px) {
          .history-row { grid-template-columns: 1fr; }
          .report-header { flex-direction: column; }
          .size-form-row { grid-template-columns: 1fr 1fr; }
        }

        @media print {
          .app-root { background: white; }
          .no-print, .tabs, .save-indicator { display: none !important; }
          .print-only { display: block; }
          .print-title { margin-bottom: 20px; font-family: var(--font-display); }
          .print-title h1 { font-size: 22px; margin: 0 0 4px; }
          .print-title p { font-size: 12px; color: var(--ink-soft); margin: 0; }
          .card { box-shadow: none; break-inside: avoid; }
          .shell { max-width: 100%; padding: 0; }
        }
      `}</style>

      <span className="save-indicator">
        {saveState === "saving" ? "Saving…" : saveState === "saved" ? "Saved" : saveState === "error" ? "Save failed" : ""}
      </span>

      <div className="header-band">
        <div className="header-inner">
          <svg className="header-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M14 6v14a6 6 0 0 0 6 6v16" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" />
            <path d="M14 6v10M18 6v10M10 6v10a4 4 0 0 0 8 0" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
            <path d="M34 6c-4 3-6 8-6 13 0 6 3 8 6 8s6-2 6-8c0-5-2-10-6-13Z" stroke="currentColor" strokeWidth="2.2" strokeLinejoin="round" />
            <path d="M34 27v15" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" />
          </svg>
          <div>
            <p className="eyebrow">Daily Tracking</p>
            <h1 className="title">Meal &amp; Symptom Tracker</h1>
            <p className="subtitle">
              Log meals from the library — sizes and macros are pre-set. Anything flagged from bloodwork or known
              as high-histamine shows up right away. Print the report whenever you're ready for the doctor.
            </p>
          </div>
        </div>
      </div>

      <div className="shell">
        <div className="tabs no-print">
          <button className={`tab-btn ${activeTab === "log" ? "active" : ""}`} onClick={() => setActiveTab("log")}>Log Today</button>
          <button className={`tab-btn ${activeTab === "library" ? "active" : ""}`} onClick={() => setActiveTab("library")}>Food Library</button>
          <button className={`tab-btn ${activeTab === "watchlist" ? "active" : ""}`} onClick={() => setActiveTab("watchlist")}>Watch List</button>
          <button className={`tab-btn ${activeTab === "history" ? "active" : ""}`} onClick={() => setActiveTab("history")}>History</button>
          <button className={`tab-btn ${activeTab === "report" ? "active" : ""}`} onClick={() => setActiveTab("report")}>Report for Doctor</button>
        </div>

        {activeTab === "log" && (
          <LogTab
            entries={entries}
            setEntries={handleSetEntriesFromLog}
            persist={() => {}}
            selectedDate={selectedDate}
            setSelectedDate={setSelectedDate}
            library={library}
            watchList={watchList}
          />
        )}
        {activeTab === "library" && (
          <LibraryTab library={library} setLibrary={setLibrary} persistLibrary={persistLibrary} watchList={watchList} />
        )}
        {activeTab === "watchlist" && (
          <WatchListTab watchList={watchList} setWatchList={setWatchList} persistWatchList={persistWatchList} />
        )}
        {activeTab === "history" && (
          <HistoryTab entries={entries} setEntries={setEntries} persist={persistEntries} setSelectedDate={setSelectedDate} setActiveTab={setActiveTab} />
        )}
        {activeTab === "report" && <ReportTab entries={entries} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
